name: forecast
on:
  schedule:
    - cron: "30 16 * * 6"  # Saturday 22:30 BDT
  workflow_dispatch:
    inputs:
      model:
        description: "persistence or seasonal_naive"
        default: "persistence"
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_leakage.py
      - run: python -m denguecast.ingest_manual || echo "manual ingest reported problems (see log)"
      - run: python -m denguecast.live_forecast --model "${{ github.event.inputs.model || 'persistence' }}"
      - run: python scripts/build_site.py
      - name: Commit forecast (commit time is the proof of timing)
        run: |
          git config user.name "denguecast-bot"
          git config user.email "denguecast-bot@users.noreply.github.com"
          git add forecasts/ data/ site/
          git diff --cached --quiet || git commit -m "forecast: live $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase && git push
